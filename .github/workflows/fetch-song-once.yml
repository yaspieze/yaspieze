name: One-time audio fetch
on: workflow_dispatch
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m yt_dlp --no-playlist -x --audio-format mp3 --audio-quality 5 --no-progress -o 'you-die-tonight.%(ext)s' 'https://www.youtube.com/watch?v=tuh7IhzPyE4'
      - uses: actions/upload-artifact@v4
        with:
          name: song-audio
          path: you-die-tonight.mp3
          retention-days: 1
